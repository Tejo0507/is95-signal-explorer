name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages on every push to the default
# branch, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling, so a
# half-finished upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type check, lint and the full test suite. A broken build or a failing
      # test stops the deployment rather than shipping.
      - name: Verify
        run: npm run check

      - name: Build
        # A GitHub Pages project site is served from /<repo>/, so Vite's base
        # must match or every asset 404s. vite.config.ts reads BASE_PATH.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
